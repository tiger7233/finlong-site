<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | הפורטפוליו שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50">
    <nav class="bg-white border-b p-6 mb-8">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-black text-gray-800">התיק <span class="text-green-600">שלי</span></h1>
            <a href="index.html" class="bg-gray-100 px-4 py-2 rounded-lg font-bold text-sm">חזרה לחיפוש</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-green-600 text-white p-8 rounded-3xl shadow-lg">
                <p class="text-sm opacity-80 font-bold uppercase mb-2">שווי תיק מוערך</p>
                <p class="text-4xl font-black">$0.00</p>
            </div>
            <div class="bg-white p-8 rounded-3xl border shadow-sm">
                <p class="text-sm text-gray-400 font-bold uppercase mb-2">מניות במעקב</p>
                <p class="text-4xl font-black">0</p>
            </div>
            <div class="bg-white p-8 rounded-3xl border shadow-sm">
                <p class="text-sm text-gray-400 font-bold uppercase mb-2">התראות פעילות</p>
                <p class="text-4xl font-black">0</p>
            </div>
        </div>

        <div class="bg-white rounded-3xl border shadow-sm overflow-hidden">
            <div class="p-8 border-b bg-gray-50 flex justify-between items-center">
                <h3 class="font-bold text-lg">רשימת מניות</h3>
                <button class="text-green-600 font-bold text-sm">+ הוספה מהירה</button>
            </div>
            <div class="p-20 text-center">
                <div class="text-5xl mb-4">📂</div>
                <h4 class="text-xl font-bold text-gray-800">התיק שלך ריק</h4>
                <p class="text-gray-400 mb-6">התחל להוסיף מניות כדי לעקוב אחרי הביצועים שלהן.</p>
                <a href="index.html" class="bg-green-600 text-white px-8 py-3 rounded-xl font-bold">חפש מניה ראשונה</a>
            </div>
        </div>
    </main>
</body>
</html>
