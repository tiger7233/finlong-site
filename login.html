<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | התחברות</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-10 rounded-3xl shadow-xl max-w-md w-full">
        <div class="text-center mb-8">
            <div class="bg-green-600 text-white w-12 h-12 flex items-center justify-center rounded-xl mx-auto font-bold mb-4">FL</div>
            <h1 class="text-3xl font-black">ברוכים הבאים</h1>
            <p class="text-gray-400">התחבר כדי לנהל את הפורטפוליו שלך</p>
        </div>
        <form class="space-y-4">
            <input type="email" placeholder="אימייל" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
            <input type="password" placeholder="סיסמה" class="w-full border p-4 rounded-xl outline-none focus:ring-2 focus:ring-green-500">
            <button class="w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition">התחברות</button>
        </form>
        <div class="mt-6 text-center text-sm">
            <span class="text-gray-500">עוד לא רשום?</span>
            <a href="#" class="text-green-600 font-bold underline">צור חשבון חדש</a>
        </div>
    </div>
</body>
</html>
