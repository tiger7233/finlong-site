<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FINLONG | כניסה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl max-w-md w-full border border-slate-100">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black text-green-600 mb-2">FINLONG</h1>
            <p class="text-slate-500">התחבר כדי לנהל את הפורטפוליו וההתראות</p>
        </div>
        <div class="space-y-4">
            <input type="email" id="email" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none" placeholder="אימייל">
            <input type="password" id="password" class="w-full p-4 bg-slate-50 border rounded-2xl outline-none" placeholder="סיסמה">
            <button onclick="handleLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">כניסה</button>
            <button onclick="handleSignUp()" class="w-full bg-white border-2 py-4 rounded-2xl font-bold text-slate-700">הרשמה (חשבון חדש)</button>
        </div>
        <p id="msg" class="text-center mt-6 text-sm font-bold"></p>
    </div>

    <script>
        const _supabase = supabase.createClient('https://mnbiqzzsaoljxskpznpl.supabase.co', 'sb_publishable_JBKyyXYWOzqomjnohXBKRA_w6cD0fyZ');

        async function handleLogin() {
            const { error } = await _supabase.auth.signInWithPassword({ email: email.value, password: password.value });
            if (error) msg.innerText = error.message;
            else window.location.href = 'index.html';
        }

        async function handleSignUp() {
            const { error } = await _supabase.auth.signUp({ email: email.value, password: password.value });
            if (error) msg.innerText = error.message;
            else msg.innerText = "בדוק את המייל לאישור ההרשמה!";
        }
    </script>
</body>
</html>
