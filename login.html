<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | כניסה למערכת</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4 text-right">

    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100 max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-green-600 tracking-tighter mb-2">FINLONG</h1>
            <p class="text-slate-500 font-medium">התחבר כדי לנהל את התיקים וההתראות שלך</p>
        </div>

        <button onclick="loginWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white border-2 border-slate-200 py-4 rounded-2xl font-bold text-slate-700 hover:bg-slate-50 transition mb-6">
            <img src="https://www.google.com/favicon.ico" class="w-5 h-5">
            התחברות מהירה עם Google
        </button>

        <div class="flex items-center gap-4 my-6">
            <div class="h-[1px] bg-slate-200 flex-1"></div>
            <span class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">או עם אימייל</span>
            <div class="h-[1px] bg-slate-200 flex-1"></div>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 mr-2">אימייל</label>
                <input type="email" id="email" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="name@example.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 mr-2">סיסמה</label>
                <input type="password" id="password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="••••••••">
            </div>

            <button onclick="handleLogin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition shadow-lg mt-2">התחברות</button>
            <button onclick="handleSignUp()" class="w-full bg-white border-2 border-slate-200 text-slate-700 py-4 rounded-2xl font-bold text-lg hover:bg-slate-50 transition">יצירת חשבון חדש</button>
        </div>

        <p id="msg" class="text-center mt-6 text-sm font-bold"></p>
    </div>

    <script>
        const SUPABASE_URL = 'https://mnbiqzzsaoljxskpznpl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JBKyyXYWOzqomjnohXBKRA_w6cD0fyZ';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // התחברות עם גוגל
        async function loginWithGoogle() {
            const { error } = await _supabase.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + '/index.html'
                }
            });
            if (error) showMsg(error.message, 'red');
        }

        // התחברות רגילה
        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                showMsg("שגיאה: " + error.message, 'red');
            } else {
                showMsg("התחברת בהצלחה! מעביר אותך...", 'green');
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        }

        // הרשמה חדשה
        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const { data, error } = await _supabase.auth.signUp({ email, password });

            if (error) {
                showMsg("שגיאה בהרשמה: " + error.message, 'red');
            } else {
                showMsg("נרשמת! בדוק את המייל שלך לאישור החשבון.", 'blue');
            }
        }

        function showMsg(text, color) {
            const msg = document.getElementById('msg');
            msg.innerText = text;
            msg.className = `text-center mt-6 text-sm font-bold text-${color}-500`;
        }
    </script>
</body>
</html>
