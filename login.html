<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | כניסת משתמש</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-10 rounded-[2.5rem] shadow-xl border border-slate-100 max-w-md w-full">
        <div class="text-center mb-10">
            <h1 class="text-4xl font-black text-green-600 tracking-tighter mb-2">FINLONG</h1>
            <p class="text-slate-500 font-medium">ברוך הבא! התחבר לניהול התיקים שלך</p>
        </div>

        <div class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">אימייל</label>
                <input type="email" id="email" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="you@example.com">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">סיסמה</label>
                <input type="password" id="password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-green-500 outline-none transition" placeholder="••••••••">
            </div>

            <button onclick="handleLogin()" id="loginBtn" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold text-lg hover:bg-slate-800 transition shadow-lg mt-4">התחברות</button>
            
            <div class="flex items-center gap-4 my-6">
                <div class="h-[1px] bg-slate-200 flex-1"></div>
                <span class="text-slate-400 text-sm font-bold uppercase">או</span>
                <div class="h-[1px] bg-slate-200 flex-1"></div>
            </div>

            <button onclick="handleSignUp()" class="w-full bg-white border-2 border-slate-200 text-slate-700 py-4 rounded-2xl font-bold text-lg hover:bg-slate-50 transition">יצירת חשבון חדש</button>
        </div>

        <p id="msg" class="text-center mt-6 text-sm font-medium"></p>
    </div>

    <script>
        // פרטי ה-Supabase שלך מהצילום מסך
        const SUPABASE_URL = 'https://mnbiqzzsaoljxskpznpl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JBKyyXYWOzqomjnohXBKRA_w6cI_r8s89v8s8v8s8v8s'; // הערה: השתמשתי במפתח הגלוי, ודא שהעתקת את ה-anon key המלא מהלוח ב-Supabase אם זה נקטע בצילום.
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                msg.className = "text-center mt-6 text-sm font-medium text-red-500";
                msg.innerText = "שגיאה: " + error.message;
            } else {
                msg.className = "text-center mt-6 text-sm font-medium text-green-500";
                msg.innerText = "מתחבר...";
                setTimeout(() => window.location.href = 'index.html', 1500);
            }
        }

        async function handleSignUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');

            const { data, error } = await _supabase.auth.signUp({ email, password });

            if (error) {
                msg.className = "text-center mt-6 text-sm font-medium text-red-500";
                msg.innerText = "שגיאה ברישום: " + error.message;
            } else {
                msg.className = "text-center mt-6 text-sm font-medium text-blue-500";
                msg.innerText = "נשלח אימייל אישור. בדוק את תיבת הדואר שלך!";
            }
        }
    </script>
</body>
</html>
