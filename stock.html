<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | ניתוח מניה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 3px solid #16a34a; color: #16a34a; font-weight: bold; }
        .hidden-tab { display: none; }
        .stats-grid div { transition: all 0.3s; }
        .stats-grid div:hover { background-color: #f0fdf4; }
    </style>
</head>
<body class="bg-slate-50 p-4 md:p-8">
    <header class="max-w-6xl mx-auto flex justify-between items-end mb-8">
        <div>
            <a href="index.html" class="text-xs text-green-600 font-bold hover:underline">← חזרה לדף הבית</a>
            <h1 id="ticker" class="text-6xl font-black text-gray-900 uppercase tracking-tighter">---</h1>
            <p id="companyName" class="text-gray-500 text-lg">טוען נתונים מה-API...</p>
        </div>
        <div class="flex gap-3">
            <button onclick="handleAddToPortfolio()" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-bold shadow-xl hover:bg-green-700 hover:scale-105 transition">הוסף לפורטפוליו</button>
        </div>
    </header>

    <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-6 mb-8 stats-grid">
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <p class="text-xs text-gray-400 font-bold uppercase mb-1">מחיר נוכחי</p>
            <p id="price" class="text-3xl font-black">---</p>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <p class="text-xs text-gray-400 font-bold uppercase mb-1">מכפיל P/E</p>
            <p id="pe" class="text-3xl font-black">---</p>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <p class="text-xs text-gray-400 font-bold uppercase mb-1">שווי שוק</p>
            <p id="mktcap" class="text-3xl font-black">---</p>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <p class="text-xs text-gray-400 font-bold uppercase mb-1">שינוי יומי</p>
            <p id="change" class="text-3xl font-black">---</p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto">
        <nav class="flex gap-10 border-b mb-8 text-sm font-bold">
            <button onclick="switchTab('overview')" id="btn-overview" class="tab-btn tab-active pb-3">סקירה וגרף</button>
            <button onclick="switchTab('financials')" id="btn-financials" class="tab-btn text-gray-400 pb-3">דוחות כספיים</button>
            <button onclick="switchTab('alerts')" id="btn-alerts" class="tab-btn text-gray-400 pb-3">התראות אישיות</button>
        </nav>

        <div id="tab-overview" class="tab-content space-y-6">
            <div class="bg-white rounded-3xl border shadow-sm h-[550px] overflow-hidden">
                <div id="tv-chart" class="h-full"></div>
            </div>
            <div class="bg-white p-8 rounded-3xl border shadow-sm">
                <h3 class="text-xl font-bold mb-4">אודות החברה</h3>
                <p id="description" class="text-gray-600 leading-relaxed">טוען תיאור חברה מפורט...</p>
            </div>
        </div>

        <div id="tab-financials" class="tab-content hidden-tab bg-white p-8 rounded-3xl border shadow-sm">
            <h3 class="text-xl font-bold mb-6">נתונים פיננסיים גולמיים</h3>
            <div id="financial-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
        </div>
    </main>

    <div id="auth-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-10 rounded-3xl max-w-sm w-full text-center shadow-2xl">
            <h2 class="text-2xl font-bold mb-4">צריך להתחבר 🔒</h2>
            <p class="text-gray-500 mb-8">כדי לשמור מניות בפורטפוליו ולהגדיר התראות, עליך להיות רשום במערכת.</p>
            <a href="login.html" class="block w-full bg-green-600 text-white py-4 rounded-xl font-bold shadow-lg hover:bg-green-700 transition">התחברות / הרשמה</a>
            <button onclick="closeModal()" class="mt-4 text-gray-400 text-sm hover:text-black">סגור</button>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const API_KEY = "UV80D7jta2txt3SXBbVyCAJNXaGQ1ZRT"; // ה-API שלך מוטמע כאן
        const symbol = new URLSearchParams(window.location.search).get('symbol') || 'AAPL';
        
        async function loadStockData() {
            try {
                // משיכת נתונים בסיסיים
                const res = await fetch(`https://financialmodelingprep.com/api/v3/quote/${symbol}?apikey=${API_KEY}`);
                const data = await res.json();
                
                // משיכת פרופיל חברה (תיאור)
                const profileRes = await fetch(`https://financialmodelingprep.com/api/v3/profile/${symbol}?apikey=${API_KEY}`);
                const profileData = await profileRes.json();

                if(data[0]) {
                    const s = data[0];
                    document.getElementById('ticker').innerText = s.symbol;
                    document.getElementById('companyName').innerText = s.name;
                    document.getElementById('price').innerText = "$" + s.price.toLocaleString();
                    document.getElementById('pe').innerText = s.pe ? s.pe.toFixed(2) : "N/A";
                    document.getElementById('mktcap').innerText = (s.marketCap / 1e9).toFixed(2) + "B";
                    document.getElementById('change').innerText = s.changesPercentage.toFixed(2) + "%";
                    document.getElementById('change').style.color = s.changesPercentage >= 0 ? "#16a34a" : "#dc2626";
                }
                if(profileData[0]) {
                    document.getElementById('description').innerText = profileData[0].description;
                }
            } catch(e) { console.error("API Error:", e); }
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden-tab'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active', 'text-green-600'));
            document.getElementById('tab-'+t).classList.remove('hidden-tab');
            document.getElementById('btn-'+t).classList.add('tab-active');
        }

        function handleAddToPortfolio() {
            // סימולציה של בדיקת התחברות
            const isLoggedIn = false; 
            if(!isLoggedIn) {
                document.getElementById('auth-modal').classList.remove('hidden');
            }
        }

        function closeModal() { document.getElementById('auth-modal').classList.add('hidden'); }

        new TradingView.widget({
            "container_id": "tv-chart",
            "symbol": symbol,
            "interval": "D",
            "theme": "light",
            "style": "1",
            "locale": "he_IL",
            "width": "100%",
            "height": "100%"
        });

        loadStockData();
    </script>
</body>
</html>
