<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>FINLONG | ניתוח מניה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-slate-50 p-6">

    <nav class="max-w-7xl mx-auto flex justify-between items-center mb-10 bg-white p-4 rounded-2xl shadow-sm">
        <div class="flex gap-6 items-center">
            <a href="index.html" class="text-2xl font-black text-green-600">FINLONG</a>
            <div class="hidden md:flex gap-4 font-bold text-slate-500">
                <a href="index.html">ראשי</a>
                <a href="portfolio.html">פורטפוליו</a>
            </div>
        </div>
        <div id="user-area">
            <a href="login.html" class="bg-slate-100 px-4 py-2 rounded-xl font-bold">התחברות</a>
        </div>
    </nav>

    <header class="max-w-7xl mx-auto flex justify-between items-end mb-8">
        <div>
            <h1 id="ticker" class="text-5xl font-black uppercase">---</h1>
            <p id="companyName" class="text-slate-500 text-xl">טוען...</p>
        </div>
        <button onclick="addToPortfolio()" class="bg-green-600 text-white px-8 py-4 rounded-2xl font-bold shadow-lg">הוסף לפורטפוליו</button>
    </header>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div id="chart" class="h-[500px] bg-white rounded-3xl border overflow-hidden"></div>
        <div id="fin" class="h-[500px] bg-white rounded-3xl border overflow-hidden"></div>
    </main>

    <script>
        const _supabase = supabase.createClient('https://mnbiqzzsaoljxskpznpl.supabase.co', 'sb_publishable_JBKyyXYWOzqomjnohXBKRA_w6cD0fyZ');
        const symbol = new URLSearchParams(window.location.search).get('symbol')?.toUpperCase() || 'AAPL';

        async function init() {
            document.getElementById('ticker').innerText = symbol;
            checkUser();
            loadWidgets();
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (user) {
                document.getElementById('user-area').innerHTML = `<span class="font-bold ml-4">${user.email}</span><button onclick="logout()" class="text-red-500 font-bold">יציאה</button>`;
            }
        }

        async function addToPortfolio() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) {
                alert("עליך להירשם כדי להוסיף מניות לפורטפוליו");
                window.location.href = 'login.html';
                return;
            }
            alert("מבצע הוספה לתיק של " + user.email);
            // כאן נכניס בעתיד את ה-Insert לטבלה
        }

        function loadWidgets() {
            new TradingView.widget({"container_id": "chart", "symbol": symbol, "width": "100%", "height": "100%", "theme": "light"});
            // ווידג'ט דוחות
            const script = document.createElement('script');
            script.src = "https://s3.tradingview.com/external-embedding/embed-widget-financials.js";
            script.innerHTML = JSON.stringify({"symbol": symbol, "width": "100%", "height": "100%"});
            document.getElementById('fin').appendChild(script);
        }

        async function logout() { await _supabase.auth.signOut(); location.reload(); }
        init();
    </script>
</body>
</html>
