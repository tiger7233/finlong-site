<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | ניתוח מניה</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-active { border-bottom: 3px solid #16a34a; color: #16a34a; font-weight: bold; }
        .hidden-tab { display: none; }
    </style>
</head>
<body class="bg-slate-50 p-4">
    <header class="max-w-6xl mx-auto flex justify-between items-end mb-8">
        <div>
            <a href="index.html" class="text-xs text-green-600 font-bold">← חזרה</a>
            <h1 id="ticker" class="text-5xl font-black text-gray-900 uppercase tracking-tighter">---</h1>
            <p id="companyName" class="text-gray-500">טוען נתונים...</p>
        </div>
        <button onclick="openModal()" class="bg-gray-900 text-white px-6 py-3 rounded-xl font-bold shadow-lg hover:scale-105 transition">+ הוסף למעקב</button>
    </header>

    <div class="max-w-6xl mx-auto grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <p class="text-xs text-gray-400 uppercase">מחיר</p>
            <p id="price" class="text-2xl font-bold">---</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <p class="text-xs text-gray-400 uppercase">מכפיל P/E</p>
            <p id="pe" class="text-2xl font-bold">---</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <p class="text-xs text-gray-400 uppercase">שווי שוק</p>
            <p id="mktcap" class="text-2xl font-bold">---</p>
        </div>
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <p class="text-xs text-gray-400 uppercase">שינוי %</p>
            <p id="change" class="text-2xl font-bold">---</p>
        </div>
    </div>

    <main class="max-w-6xl mx-auto">
        <nav class="flex gap-8 border-b mb-6 text-sm font-bold">
            <button onclick="switchTab('chart')" id="btn-chart" class="tab-btn tab-active pb-2">גרף</button>
            <button onclick="switchTab('fin')" id="btn-fin" class="tab-btn text-gray-400 pb-2">דוחות כספיים</button>
        </nav>

        <div id="tab-chart" class="tab-content h-[500px] bg-white rounded-2xl border overflow-hidden">
            <div id="tv-chart" class="h-full"></div>
        </div>

        <div id="tab-fin" class="tab-content hidden-tab bg-white p-8 rounded-2xl border">
            <h3 class="font-bold mb-4">ביצועים פיננסיים (מקור: FMP)</h3>
            <div id="financial-data" class="space-y-4 text-sm">
                <p>טוען נתונים גולמיים מהדוחות...</p>
            </div>
        </div>
    </main>

    <div id="modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl max-w-sm w-full text-center">
            <h2 class="text-2xl font-bold mb-4">צריך להתחבר 🔒</h2>
            <p class="text-gray-500 mb-6">כדי לשמור מניות ולנהל רשימות מעקב אישיות, עליך להיות רשום.</p>
            <a href="login.html" class="block w-full bg-green-600 text-white py-3 rounded-xl font-bold mb-4">התחברות / הרשמה</a>
            <button onclick="closeModal()" class="text-gray-400 text-sm">סגור</button>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const API_KEY = "YOUR_FMP_API_KEY"; // הכנס כאן את המפתח שלך
        const symbol = new URLSearchParams(window.location.search).get('symbol') || 'AAPL';
        
        async function loadData() {
            try {
                const res = await fetch(`https://financialmodelingprep.com/api/v3/quote/${symbol}?apikey=${API_KEY}`);
                const data = await res.json();
                if(data[0]) {
                    const s = data[0];
                    document.getElementById('ticker').innerText = s.symbol;
                    document.getElementById('companyName').innerText = s.name;
                    document.getElementById('price').innerText = "$" + s.price;
                    document.getElementById('pe').innerText = s.pe || "N/A";
                    document.getElementById('mktcap').innerText = (s.marketCap / 1e9).toFixed(2) + "B";
                    document.getElementById('change').innerText = s.changesPercentage.toFixed(2) + "%";
                }
            } catch(e) { console.error(e); }
        }

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden-tab'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('tab-active'));
            document.getElementById('tab-'+t).classList.remove('hidden-tab');
            document.getElementById('btn-'+t).classList.add('tab-active');
        }

        new TradingView.widget({"container_id": "tv-chart", "symbol": symbol, "interval": "D", "theme": "light", "width": "100%", "height": "100%"});
        function openModal() { document.getElementById('modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modal').classList.add('hidden'); }
        loadData();
    </script>
</body>
</html>
