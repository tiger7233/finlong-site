<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | הבית של המשקיעים</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <nav class="bg-white border-b p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-green-600 text-white p-2 rounded-lg font-bold">FL</div>
                <h1 class="text-2xl font-black text-gray-800">FIN<span class="text-green-600">LONG</span></h1>
            </div>
            <div class="flex-grow max-w-md mx-8 relative hidden md:block">
                <input id="nav-search" type="text" placeholder="חפש מניה..." class="w-full border rounded-full py-2 px-6 focus:ring-2 focus:ring-green-500 outline-none">
            </div>
            <div class="flex gap-4 items-center">
                <a href="portfolio.html" class="text-sm font-bold text-gray-600 hover:text-green-600">התיק שלי</a>
                <a href="login.html" class="bg-green-600 text-white px-5 py-2 rounded-full text-sm font-bold">כניסה</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-4 space-y-6">
            <div class="card p-6 border-t-4 border-green-600">
                <h2 class="text-lg font-bold mb-4">גישה מהירה</h2>
                <div class="space-y-3">
                    <a href="stock.html?symbol=GOOG" class="flex justify-between p-3 bg-gray-50 rounded-lg hover:bg-green-50">
                        <span class="font-bold">GOOG</span><span class="text-green-600">+$1.45</span>
                    </a>
                    <a href="stock.html?symbol=CPRT" class="flex justify-between p-3 bg-gray-50 rounded-lg hover:bg-green-50">
                        <span class="font-bold">CPRT</span><span class="text-red-500">-$0.21</span>
                    </a>
                </div>
            </div>
        </div>

        <div class="lg:col-span-8">
            <div class="card p-4 h-[600px]">
                <h2 class="text-lg font-bold mb-4">מפת חום גלובלית</h2>
                <div id="heatmap-container" class="h-full w-full">
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
                    {
                        "dataSource": "S_P_500",
                        "symbolUrl": "/stock.html?symbol={symbol}",
                        "colorTheme": "light", "width": "100%", "height": "100%", "locale": "he_IL"
                    }
                    </script>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('nav-search').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') window.location.href = `stock.html?symbol=${e.target.value.toUpperCase()}`;
        });
    </script>
</body>
</html>
