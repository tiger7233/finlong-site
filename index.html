<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | ניהול השקעות חכם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Segoe UI', sans-serif; }
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .hover-green:hover { border-color: #16a34a; background-color: #f0fdf4; transition: all 0.3s; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-2">
                <div class="bg-green-600 text-white p-2 rounded-lg font-bold">FL</div>
                <h1 class="text-2xl font-black text-gray-800">FIN<span class="text-green-600">LONG</span></h1>
            </div>
            
            <div class="flex-grow max-w-md relative">
                <input id="global-search" type="text" placeholder="חפש מניה (למשל: AAPL)..." 
                       class="w-full border border-gray-300 rounded-full py-2 px-6 focus:ring-2 focus:ring-green-500 outline-none shadow-sm text-sm">
                <button onclick="searchStock()" class="absolute left-3 top-1/2 -translate-y-1/2 text-green-600 font-bold px-2">חפש</button>
            </div>

            <button class="bg-green-600 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md">כניסה</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-6">התיק שלי</h2>
                    <div id="portfolio-list" class="space-y-4">
                        <a href="stock.html?symbol=GOOG" class="card p-4 flex justify-between items-center hover-green block border border-gray-100">
                            <div class="font-bold text-gray-700">GOOG</div>
                            <div class="text-left font-bold text-green-600">+1.45%</div>
                        </a>
                        <a href="stock.html?symbol=CPRT" class="card p-4 flex justify-between items-center hover-green block border border-gray-100">
                            <div class="font-bold text-gray-700">CPRT</div>
                            <div class="text-left font-bold text-red-500">-0.21%</div>
                        </a>
                    </div>
                </div>

                <div class="card p-6 bg-green-600 text-white shadow-xl">
                    <h2 class="text-lg font-bold mb-2">התראות מחיר ומכפילים</h2>
                    <p class="text-green-100 text-sm mb-4">אל תפספס הזדמנויות. הגדר התראה וקבל הודעה כשהמניה מגיעה ליעד שקבעת.</p>
                    <button class="w-full bg-white text-green-700 py-2 rounded-lg font-bold text-sm hover:bg-green-50 transition">הגדר התראה חדשה</button>
                </div>
            </div>

            <div class="lg:col-span-8">
                <div class="card p-6 h-full">
                    <h2 class="text-lg font-bold mb-4">מפת חום - S&P 500</h2>
                    <div class="h-[600px] w-full bg-gray-50 rounded-lg overflow-hidden border">
                        <div class="tradingview-widget-container h-full">
                            <div class="tradingview-widget-container__widget h-full"></div>
                            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
                            {
                                "exchanges": [],
                                "dataSource": "S_P_500",
                                "grouping": "sector",
                                "blockSize": "market_cap",
                                "blockColor": "change",
                                "locale": "he_IL",
                                "symbolUrl": "https://finlong-site.vercel.app/stock.html?symbol={symbol}", 
                                "colorTheme": "light",
                                "hasTopBar": true,
                                "isDataSetEnabled": true,
                                "isZoomEnabled": true,
                                "hasSymbolTooltip": true,
                                "width": "100%",
                                "height": "100%"
                            }
                            </script>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // פונקציית חיפוש
        function searchStock() {
            const ticker = document.getElementById('global-search').value.toUpperCase();
            if (ticker) {
                window.location.href = `stock.html?symbol=${ticker}`;
            }
        }

        // מאפשר ללחוץ Enter בחיפוש
        document.getElementById('global-search').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchStock();
            }
        });
    </script>
</body>
</html>
