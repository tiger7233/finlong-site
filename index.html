<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FINLONG | ניהול השקעות חכם</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #1e293b; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .bg-primary { background-color: #ffffff; }
        .accent-green { color: #16a34a; }
        .bg-green-soft { background-color: #f0fdf4; }
        .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="bg-white border-b border-gray-200 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-green-600 text-white p-2 rounded-lg font-bold">FL</div>
                <h1 class="text-2xl font-black text-gray-800 tracking-tight">FIN<span class="text-green-600">LONG</span></h1>
            </div>
            <div class="hidden md:flex gap-6 text-sm font-medium">
                <a href="#" class="text-green-600">דף הבית</a>
                <a href="#" class="hover:text-green-600 transition">הפורטפוליו שלי</a>
                <a href="#" class="hover:text-green-600 transition">מפת חום</a>
                <a href="#" class="hover:text-green-600 transition">התראות</a>
            </div>
            <button class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-full text-sm font-bold shadow-md transition">כניסת משתמש</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-4 space-y-6">
                
                <div class="card p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold">המעקב שלי</h2>
                        <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">מעודכן לזמן אמת</span>
                    </div>
                    
                    <div id="portfolio-list" class="space-y-4">
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                            <div>
                                <div class="font-bold">GOOG</div>
                                <div class="text-xs text-gray-500">Alphabet Inc.</div>
                            </div>
                            <div class="text-left">
                                <div class="font-bold text-green-600">+1.45%</div>
                                <div class="text-xs text-gray-400">$174.20</div>
                            </div>
                        </div>
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                            <div>
                                <div class="font-bold">CPRT</div>
                                <div class="text-xs text-gray-500">Copart, Inc.</div>
                            </div>
                            <div class="text-left">
                                <div class="font-bold text-red-500">-0.21%</div>
                                <div class="text-xs text-gray-400">$54.12</div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex gap-2">
                        <input id="stock-input" type="text" placeholder="הוסף סימול (למשל XLK)" class="flex-grow border border-gray-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500">
                        <button onclick="addStock()" class="bg-gray-800 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-black transition">הוסף</button>
                    </div>
                </div>

                <div class="card p-6 bg-green-600 text-white">
                    <h2 class="text-lg font-bold mb-2">התראות חכמות</h2>
                    <p class="text-green-100 text-sm mb-4">קבל הודעה כשמניה מגיעה למכפיל רווח (P/E) שקבעת או למחיר יעד.</p>
                    <button class="w-full bg-white text-green-700 py-2 rounded-lg font-bold text-sm hover:bg-green-50 transition shadow-lg">צור התראה חדשה</button>
                </div>

            </div>

            <div class="lg:col-span-8 space-y-6">
                
                <div class="card p-6">
                    <h2 class="text-lg font-bold mb-4">מפת חום גלובלית</h2>
                    <div class="h-[500px] w-full bg-gray-50 rounded-lg overflow-hidden border border-gray-200">
                        <div class="tradingview-widget-container h-full">
                            <div class="tradingview-widget-container__widget h-full"></div>
                            <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-stock-heatmap.js" async>
                            {
                                "exchanges": [],
                                "dataSource": "S_P_500",
                                "grouping": "sector",
                                "blockSize": "market_cap",
                                "blockColor": "change",
                                "locale": "he_IL",
                                "symbolUrl": "",
                                "colorTheme": "light",
                                "hasTopBar": true,
                                "isDataSetEnabled": true,
                                "isZoomEnabled": true,
                                "hasSymbolTooltip": true,
                                "width": "100%",
                                "height": "100%"
                            }
                            </script>
                        </div>
                    </div>
                </div>

            </div>

        </div>index.html
    </main>

    <script>
        function addStock() {
            const input = document.getElementById('stock-input');
            const ticker = input.value.toUpperCase();
            if (ticker) {
                const list = document.getElementById('portfolio-list');
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-green-50 rounded-lg border border-green-100 animate-pulse";
                div.innerHTML = `<div><div class="font-bold">${ticker}</div><div class="text-xs text-gray-500">בבדיקה...</div></div><div class="text-left font-bold text-gray-400">---</div>`;
                list.appendChild(div);
                input.value = '';
            }
        }
    </script>
</body>
</html>
